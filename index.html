<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>날씨 정보 웹앱</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="weather-app">
    <h1>🌦 날씨 정보</h1>
    <div class="input-container">
      <input type="text" id="cityInput" placeholder="도시 이름 입력 (예: Seoul)" />
      <button onclick="getWeather()">조회</button>
    </div>
    <div id="weatherResult" class="weather-result"></div>
    <h2 id="hourlyTitle" style="display:none;">⏰ 시간별 예보</h2>
    <div id="hourlyForecast" class="hourly-forecast"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
